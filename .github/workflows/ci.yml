name: PPW SIM CI

on:
  push:
    branches:
      - main
      - "sim-*"
      - "alpha-*"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ppw
          POSTGRES_PASSWORD: ppw
          POSTGRES_DB: ppw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ppw -d ppw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ppw:ppw@127.0.0.1:5432/ppw_test
      PPW_ALPHA_PLAYER_ID: ci-alpha-player
      PPW_ALPHA_WORLD_SEED: 20261002
      PPW_ENABLE_MANUAL_WEEK_ADVANCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run full test suite
        run: npm test
      - name: Run planner roster-edit regression coverage
        run: node dist/tests/run-planner-edit-regression-tests.js
      - name: Run Card running-order regressions
        run: node dist/tests/run-card-running-order-tests.js
      - name: Run segment story-goal authoring regressions
        run: node dist/tests/run-segment-story-goal-tests.js
      - name: Run contract-offer Attention coverage
        run: node dist/tests/run-contract-offer-attention-tests.js
      - name: Run alignment foundation coverage
        run: node dist/tests/run-alignment-tests.js
      - name: Run show-flow coverage
        run: node dist/tests/run-show-flow-tests.js
      - name: Run Programme web service coverage
        run: node dist/tests/run-web-programme-service-tests.js
      - name: Run Programme match integration coverage
        run: node dist/tests/run-programme-match-integration-tests.js
      - name: Run Programme signal coverage
        run: node dist/tests/run-programme-signal-tests.js
      - name: Run Programme segment coverage
        run: node dist/tests/run-programme-segment-tests.js
      - name: Run talent story-memory coverage
        run: node dist/tests/run-talent-story-memory-tests.js
      - name: Run talent expectation evidence coverage
        run: node dist/tests/run-talent-expectation-tests.js
      - name: Run Backstage lifecycle coverage
        run: node dist/tests/run-backstage-tests.js
      - name: Run Backstage server-service coverage
        run: node dist/tests/run-web-backstage-service-tests.js
      - name: Build Alpha web app
        run: npm run web:build
      - name: Run Alpha HTTP integration
        run: npm run test:web-http
      - name: Run PostgreSQL repository integration tests
        run: npm run test:postgres-repository
      - name: Audit creative control across paired multi-seed Worlds
        run: npm run audit:creative
      - name: Preserve creative control audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-control-multiseed-audit
          path: artifacts/creative-multiseed-audit.json
          if-no-files-found: ignore
      - name: Audit indie affordability and shared-world talent liquidity
        run: npm run audit:indie-market
      - name: Preserve indie affordability audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indie-affordability-market-audit
          path: artifacts/indie-affordability-market-audit.json
          if-no-files-found: ignore
      - name: Audit 26-week player-authored indie operations under World Lock
        run: npm run audit:human-indie
      - name: Preserve human-owned indie baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-indie-26week-audit
          path: artifacts/human-indie-26week-audit.json
          if-no-files-found: ignore
      - name: Audit engaged indie contracts and authored cards for 26 weeks
        run: npm run audit:human-indie-engaged
      - name: Preserve engaged human indie economy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-indie-engaged-26week-audit
          path: artifacts/human-indie-engaged-26week-audit.json
          if-no-files-found: ignore
      - name: Run 10-year standard-seed smoke simulation
        run: npm run sim -- --seed 20261002 --weeks 520
      # Feature branches can opt into the century stress gate by including [long] in the push commit message.
      - name: Run 100-year standard-seed validation
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[long]'))
        run: npm run sim -- --seed 20261002 --weeks 5200
