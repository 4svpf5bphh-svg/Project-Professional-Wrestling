name: PPW ID Counter Patch

on:
  push:
    branches:
      - work-alpha-1a-id-counters
    paths:
      - .github/workflows/id-counter-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded refactor
        run: python3 scripts/apply-id-counter-slice.py
      - name: Install dependencies
        run: npm install
      - name: Run full functional suite
        run: npm test
      - name: Commit generated slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/sim-core/src tests/run-state-schema-tests.ts tests/run-id-allocation-tests.ts
          git commit -m "refactor: allocate live entity IDs from persisted counters" || exit 0
          git push origin HEAD:work-alpha-1a-id-counters
