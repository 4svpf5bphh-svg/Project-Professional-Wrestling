name: PPW Staff Execution Patch

on:
  push:
    branches:
      - work-alpha-1a-staff-execution
    paths:
      - .github/workflows/staff-execution-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded staff-execution refactor
        run: python3 scripts/apply-staff-execution-slice.py
      - name: Install dependencies
        run: npm install
      - name: Run full functional suite
        run: npm test
      - name: Commit generated slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/sim-core/src/events.ts packages/sim-core/src/matches.ts packages/sim-core/src/resolution.ts tests/run-human-routine-tests.ts
          git commit -m "refactor: separate staff execution from human ownership" || exit 0
          git push origin HEAD:work-alpha-1a-staff-execution
